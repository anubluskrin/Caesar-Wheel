<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RC4 Stream Cipher</title>
    <link rel="stylesheet" href="/shared/theme.css">
    <style>
      #processLogContainer {
        height: 200px !important;
        max-height: 200px !important;
        overflow-y: auto !important;
        box-sizing: border-box;
      }
      #outputText {
        height: 60px !important;
        min-height: 60px !important;
        max-height: 60px !important;
        resize: none;
        box-sizing: border-box;
      }
    </style>
</head>
<body>

<div class="sheet">
    <!-- Slot Navigasi Bar Atas -->
    <div id="nav-slot"></div>

    <!-- Header Judul & Seri -->
    <div class="letterhead">
        <h1>RC4 Stream Cipher</h1>
        <div class="ref">No. seri: RC4-08<br>Stream cipher, KSA & PRGA</div>
    </div>

    <p class="footnote" style="margin-bottom:20px;">
        RC4 memproses pesan byte demi byte dengan aliran kunci semu (*keystream*). Hasil enkripsi berupa format Hexadecimal; dekripsi menerima Hex dan mengembalikannya menjadi teks asli.
    </p>

    <!-- Field Kunci -->
    <div class="field">
        <label for="cipherKey">kunci rahasia</label>
        <input type="text" id="cipherKey" value="RAHASIA" placeholder="Masukkan kunci rahasia...">
    </div>

    <!-- Bento Grid Layout 2 Kolom -->
    <div class="bento-grid">

        <!-- Kolom Kiri: Input & Mode -->
        <div class="bento-panel">
            <div class="mode-row" style="margin-bottom:0;">
                <button class="mode-btn active" id="btnModeEncrypt">Sandikan</button>
                <button class="mode-btn" id="btnModeDecrypt">Pecahkan</button>
            </div>

            <div class="field">
                <label id="inputLabel" for="inputText">teks asli</label>
                <textarea id="inputText" style="min-height:140px;">SELAMAT DATANG</textarea>
            </div>

            <button class="run-btn" id="runBtn">Jalankan Proses ▶</button>
        </div>

        <!-- Kolom Kanan: Log & Hasil -->
        <div class="bento-panel">
            <div class="field">
                <label>log proses (keystream & xor)</label>
                <div id="processLogContainer" class="terminal-log">Aktivitas proses akan muncul di sini...</div>
            </div>

            <div class="field" style="margin-top:15px;">
                <label id="outputLabel">hasil (hex)</label>
                <textarea id="outputText" readonly style="width:100%; background:var(--ink, #000); color:#00ff66; font-family:monospace; font-weight:bold; padding:8px;"></textarea>
            </div>
        </div>

    </div>
</div>

<!-- Script Pendukung & Logika -->
<script src="/shared/nav.js"></script>
<script src="/shared/process-log.js"></script>
<script src="/ciphers/rc4.js"></script>

<script>
    let mode = 'encrypt';

    const btnModeEncrypt = document.getElementById('btnModeEncrypt');
    const btnModeDecrypt = document.getElementById('btnModeDecrypt');
    const inputLabel = document.getElementById('inputLabel');
    const outputLabel = document.getElementById('outputLabel');
    const inputText = document.getElementById('inputText');
    const outputText = document.getElementById('outputText');
    const cipherKey = document.getElementById('cipherKey');
    const runBtn = document.getElementById('runBtn');

    // Implementasi Engine Standar RC4
    function executeRC4(text, key, isEncrypt) {
        let S = [];
        for (let i = 0; i < 256; i++) S[i] = i;

        // KSA
        let j = 0;
        for (let i = 0; i < 256; i++) {
            j = (j + S[i] + key.charCodeAt(i % key.length)) % 256;
            [S[i], S[j]] = [S[j], S[i]];
        }

        let logs = [];
        logs.push(`=== INISIALISASI KSA SELESAI ===`);

        // PRGA & XOR
        let i = 0;
        j = 0;

        if (isEncrypt) {
            let out = [];
            for (let k = 0; k < text.length; k++) {
                i = (i + 1) % 256;
                j = (j + S[i]) % 256;
                [S[i], S[j]] = [S[j], S[i]];

                let K = S[(S[i] + S[j]) % 256];
                let charCode = text.charCodeAt(k);
                let cipherByte = charCode ^ K;

                let hex = cipherByte.toString(16).padStart(2, '0');
                out.push(hex);
                logs.push(`Byte [${k}] '${text[k]}' (0x${charCode.toString(16)}) ^ Keystream (0x${K.toString(16).padStart(2, '0')}) = Hex: ${hex}`);
            }
            return { result: out.join(''), logs: logs };
        } else {
            let cleanHex = text.replace(/\s+/g, '');
            let decryptedStr = "";
            for (let k = 0; k < cleanHex.length; k += 2) {
                i = (i + 1) % 256;
                j = (j + S[i]) % 256;
                [S[i], S[j]] = [S[j], S[i]];

                let K = S[(S[i] + S[j]) % 256];
                let hexByte = parseInt(cleanHex.substr(k, 2), 16);
                let plainByte = hexByte ^ K;
                let char = String.fromCharCode(plainByte);

                decryptedStr += char;
                logs.push(`Hex [${cleanHex.substr(k, 2)}] ^ Keystream (0x${K.toString(16).padStart(2, '0')}) = Teks: '${char}'`);
            }
            return { result: decryptedStr, logs: logs };
        }
    }

    // Switch Mode Sandikan
    btnModeEncrypt.addEventListener('click', () => {
        mode = 'encrypt';
        btnModeEncrypt.classList.add('active');
        btnModeDecrypt.classList.remove('active');
        inputLabel.textContent = 'teks asli';
        outputLabel.textContent = 'hasil (hex)';
        inputText.value = 'SELAMAT DATANG';
    });

    // Switch Mode Pecahkan
    btnModeDecrypt.addEventListener('click', () => {
        mode = 'decrypt';
        btnModeDecrypt.classList.add('active');
        btnModeEncrypt.classList.remove('active');
        inputLabel.textContent = 'ciphertext (hex)';
        outputLabel.textContent = 'hasil (teks asli)';
        if (outputText.value) {
            inputText.value = outputText.value;
        }
    });

    // Eksekusi Proses
    runBtn.addEventListener('click', () => {
        const key = cipherKey.value;
        const text = inputText.value;

        if (!key || !text) {
            alert("Kunci dan Teks Input wajib diisi!");
            return;
        }

        runBtn.disabled = true;

        try {
            let resObj = null;

            if (typeof rc4Process === 'function') {
                resObj = rc4Process(text, key, mode);
            } else if (mode === 'encrypt' && typeof encryptRC4 === 'function') {
                const r = encryptRC4(text, key);
                resObj = typeof r === 'object' ? r : { result: r };
            } else if (mode === 'decrypt' && typeof decryptRC4 === 'function') {
                const r = decryptRC4(text, key);
                resObj = typeof r === 'object' ? r : { result: r };
            }

            if (!resObj || !resObj.result) {
                resObj = executeRC4(text, key, mode === 'encrypt');
            }

            const finalResult = resObj.result || resObj;
            outputText.value = finalResult;

            let logLines = resObj.logs || resObj.log || [
                `> ${mode === 'encrypt' ? 'Enkripsi' : 'Dekripsi'} RC4 Selesai`,
                `> Input: ${text}`,
                `> Output: ${finalResult}`
            ];

            if (typeof runTerminalLog === 'function') {
                runTerminalLog('processLogContainer', logLines, () => { runBtn.disabled = false; }, 80);
            } else {
                document.getElementById('processLogContainer').textContent = logLines.join('\n');
                runBtn.disabled = false;
            }

        } catch (err) {
            if (typeof runTerminalLog === 'function') {
                runTerminalLog('processLogContainer', [`ERROR: ${err.message}`], () => { runBtn.disabled = false; });
            } else {
                alert("Terjadi kesalahan: " + err.message);
                runBtn.disabled = false;
            }
        }
    });
</script>

</body>
</html>
