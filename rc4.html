<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RC4</title>
<link rel="stylesheet" href="/shared/theme.css">
</head>
<body>

<div class="sheet">
  <div id="nav-slot"></div>

  <div class="letterhead">
    <h1>RC4</h1>
    <div class="ref">No. seri: RC4-256<br>Stream cipher, KSA + PRGA</div>
  </div>

  <p class="footnote" style="margin-bottom:20px; font-size:16px;">
    RC4 membangun tabel status 256-byte dari kunci (KSA), lalu menghasilkan aliran
    byte acak semu (keystream) lewat PRGA yang di-XOR dengan pesan. Enkripsi dan
    dekripsi memakai proses identik — cuma arah input/outputnya dibalik.
  </p>

  <div class="field">
    <label for="keyInput">kunci</label>
    <input type="text" id="keyInput" value="RAHASIA">
  </div>

  <div class="bento-grid">

    <div class="bento-panel">
      <div class="mode-row" style="margin-bottom:0;">
        <button class="mode-btn active" data-mode="encrypt">Sandikan</button>
        <button class="mode-btn" data-mode="decrypt">Pecahkan</button>
      </div>

      <div class="field">
        <label id="inputLabel" for="inputText">teks asli</label>
        <textarea id="inputText" style="min-height:140px; font-size:17px;">SELAMAT DATANG</textarea>
      </div>

      <button class="run-btn" id="runBtn">Jalankan Proses ▶</button>
    </div>

    <div class="bento-panel">
      <div class="field">
        <label>log KSA & PRGA</label>
        <div id="processLogContainer" class="terminal-log" style="min-height:300px; font-size:15px;"></div>
      </div>

      <div class="field">
        <label id="outputLabel">hasil (hex)</label>
        <div class="output-box" id="outputText" style="font-size:17px;"></div>
      </div>
    </div>

  </div>
</div>

<script src="/shared/nav.js"></script>
<script src="/shared/process-log.js"></script>
<script src="/shared/byte-utils.js"></script>
<script src="/ciphers/rc4.js"></script>
<script>
  let mode = 'encrypt';
  const modeButtons = document.querySelectorAll('.mode-btn');
  const keyInput = document.getElementById('keyInput');
  const inputText = document.getElementById('inputText');
  const inputLabel = document.getElementById('inputLabel');
  const outputText = document.getElementById('outputText');
  const outputLabel = document.getElementById('outputLabel');
  const runBtn = document.getElementById('runBtn');

  modeButtons.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      modeButtons.forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      mode = btn.dataset.mode;
      outputLabel.textContent = mode === 'encrypt' ? 'hasil (hex)' : 'hasil (teks asli)';
      inputLabel.textContent = mode === 'encrypt' ? 'teks asli' : 'teks tersandi (hex)';
      inputText.value = mode === 'encrypt'
        ? 'SELAMAT DATANG'
        : rc4Process('SELAMAT DATANG', keyInput.value, 'encrypt').result;
      outputText.textContent = ' ';
    });
  });

  runBtn.addEventListener('click', ()=>{
    outputText.textContent = ' ';
    const { result, steps } = rc4Process(inputText.value, keyInput.value, mode);
    runBtn.disabled = true;
    runTerminalLog('processLogContainer', steps, ()=>{
      outputText.textContent = result || ' ';
      runBtn.disabled = false;
    }, 12);
  });
</script>
</body>
</html>
