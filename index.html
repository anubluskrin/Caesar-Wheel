
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caesar Wheel</title>
<link rel="stylesheet" href="/shared/theme.css">

<style>
  .intro{
    font-size:15px;
    line-height:1.6;
    color:var(--ink-soft);
    margin:0 0 28px;
  }

  .stage-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:20px;
    padding:28px 20px 22px;
    margin-bottom:26px;
  }

  .stage{
    position:relative;
    width:min(70vw, 380px);
    aspect-ratio:1/1;
    margin:6px 0;
    filter:drop-shadow(0 8px 20px rgba(0,0,0,0.10));
  }

  svg{width:100%;height:100%;display:block;overflow:visible;}

  .disc-inner{
    cursor:grab;
    transform-origin:250px 250px;
    transition:transform 0.15s ease-out;
  }
  .disc-inner.dragging{ cursor:grabbing; transition:none; }

  .letter-outer, .letter-inner{
    font-family:-apple-system, 'Inter', sans-serif;
    font-weight:700;
    fill:var(--ink);
    text-anchor:middle;
    dominant-baseline:middle;
    user-select:none;
  }
  .letter-inner{ fill:var(--paper-dark); }

  .pointer-tick{ fill:var(--accent); stroke:none; }
  .center-hub{ fill:var(--ink); }
  .center-hub-inner{ fill:var(--paper-dark); }

  .controls{
    display:flex;
    align-items:center;
    gap:14px;
    margin-top:16px;
  }
  .shift-badge{
    font-family:'SF Mono', 'Courier New', monospace;
    font-weight:700;
    font-size:14px;
    color:var(--ink);
    border:1px solid var(--line);
    border-radius:999px;
    padding:8px 18px;
    min-width:110px;
    text-align:center;
    background:var(--paper-dark);
  }
  .nudge{
    width:36px;
    height:36px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--paper-dark);
    color:var(--ink);
    font-size:16px;
    cursor:pointer;
    transition:background .15s ease, border-color .15s ease;
  }
  .nudge:hover{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent); }
  .nudge:active{ transform:scale(0.94); }

  .hint{
    font-size:13px;
    color:var(--ink-soft);
    margin-top:14px;
    text-align:center;
  }

  @media (prefers-reduced-motion: reduce){
    .disc-inner{ transition:none; }
  }
</style>
</head>
<body>
 
<div class="sheet">
  <div id="nav-slot"></div>
 
  <div class="letterhead">
    <h1>Caesar Cipher Wheel</h1>
    <div class="ref">
      <a href="https://github.com/anubluskrin/Caesar-Wheel" target="_blank" rel="noopener noreferrer"
        style="display:inline-flex; align-items:center; gap:6px; border:1px solid var(--ink); padding:6px 12px; color:var(--ink); text-decoration:none; font-size:13px;">
        ⭐ Star di GitHub
      </a>
      <br>
      <br>Support Dev
    </div>
  </div>
 
  <p class="intro">
    Putar cakram bagian dalam sampai barisnya sejajar dengan huruf yang dicari.
  </p>
 
  <div class="stage-wrap">
    <div class="stage">
      <svg viewBox="0 0 500 500">
        <g class="disc-outer" id="outerDisc"></g>
        <g class="disc-inner" id="innerDisc"></g>
        <polygon class="pointer-tick" points="250,18 240,44 260,44"></polygon>
        <circle class="center-hub" cx="250" cy="250" r="24"></circle>
        <circle class="center-hub-inner" cx="250" cy="250" r="14"></circle>
      </svg>
    </div>
 
    <div class="controls">
      <button class="nudge" id="nudgeLeft" aria-label="Kurangi pergeseran">&#8249;</button>
      <div class="shift-badge" id="shiftBadge">geser: 0</div>
      <button class="nudge" id="nudgeRight" aria-label="Tambah pergeseran">&#8250;</button>
    </div>
    <p class="hint">seret cakram dengan mouse atau jari untuk memutar</p>
  </div>
 
  <div class="mode-row">
    <button class="mode-btn active" data-mode="encode">ENKRIPSI (Sandikan)</button>
    <button class="mode-btn" data-mode="decode">DEKRIPSI (Pecahkan)</button>
  </div>
 
  <div class="field">
    <label for="inputText">teks asli</label>
    <textarea id="inputText" placeholder="Ketik pesan di sini...">HEI ANTEK ANTEK ASING</textarea>
  </div>
 
  <div class="field">
    <label id="outputLabel">hasil sandi</label>
    <div class="output-box" id="outputText"></div>
    <p class="footnote" id="footnote"></p>
  </div>
 
</div>
 
<script src="/shared/nav.js"></script>
<script>
(function(){
  const ALPHA = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  const N = 26;
  const R_OUTER = 240;
  const R_OUTER_LETTERS = 205;
  const R_INNER = 175;
  const R_INNER_LETTERS = 140;
  const CX = 250, CY = 250;
 
  // --- efek suara (Web Audio API, tanpa file eksternal) ---
  let audioCtx = null;
  function getAudioCtx(){
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  function playTick(strength = 1){
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'square';
    osc.frequency.value = 900 + Math.random() * 200;
    gain.gain.setValueAtTime(0.15 * strength, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
    osc.connect(gain).connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.05);
  }
 
  const outerDisc = document.getElementById('outerDisc');
  const innerDisc = document.getElementById('innerDisc');
 
  let outerRing = `<circle cx="${CX}" cy="${CY}" r="${R_OUTER}" fill="var(--paper-dark)" stroke="var(--ink)" stroke-width="2"></circle>`;
  outerRing += `<circle cx="${CX}" cy="${CY}" r="${R_INNER+18}" fill="none" stroke="var(--ink)" stroke-width="1"></circle>`;
  for(let i=0;i<N;i++){
    const angle = (i / N) * 2 * Math.PI - Math.PI/2;
    const x = CX + R_OUTER_LETTERS * Math.cos(angle);
    const y = CY + R_OUTER_LETTERS * Math.sin(angle);
    outerRing += `<text class="letter-outer" x="${x.toFixed(2)}" y="${y.toFixed(2)}" font-size="20">${ALPHA[i]}</text>`;
    const x1 = CX + R_OUTER * Math.cos(angle);
    const y1 = CY + R_OUTER * Math.sin(angle);
    const x2 = CX + (R_OUTER-10) * Math.cos(angle);
    const y2 = CY + (R_OUTER-10) * Math.sin(angle);
    outerRing += `<line x1="${x1.toFixed(2)}" y1="${y1.toFixed(2)}" x2="${x2.toFixed(2)}" y2="${y2.toFixed(2)}" stroke="var(--ink)" stroke-width="1"></line>`;
  }
  outerDisc.innerHTML = outerRing;
 
  let innerRing = `<circle cx="${CX}" cy="${CY}" r="${R_INNER}" fill="var(--paper)" stroke="var(--ink)" stroke-width="2"></circle>`;
  innerRing += `<circle cx="${CX}" cy="${CY}" r="${R_INNER-58}" fill="var(--ink)" stroke="var(--ink)" stroke-width="1"></circle>`;
  for(let i=0;i<N;i++){
    const angle = (i / N) * 2 * Math.PI - Math.PI/2;
    const x = CX + R_INNER_LETTERS * Math.cos(angle);
    const y = CY + R_INNER_LETTERS * Math.sin(angle);
    innerRing += `<text class="letter-inner" x="${x.toFixed(2)}" y="${y.toFixed(2)}" font-size="18" fill="var(--ink)">${ALPHA[i]}</text>`;
  }
  for(let i=0;i<52;i++){
    const angle = (i/52) * 2 * Math.PI;
    const x1 = CX + R_INNER * Math.cos(angle);
    const y1 = CY + R_INNER * Math.sin(angle);
    const x2 = CX + (R_INNER-6) * Math.cos(angle);
    const y2 = CY + (R_INNER-6) * Math.sin(angle);
    innerRing += `<line x1="${x1.toFixed(2)}" y1="${y1.toFixed(2)}" x2="${x2.toFixed(2)}" y2="${y2.toFixed(2)}" stroke="var(--ink)" stroke-width="1.5"></line>`;
  }
  innerDisc.innerHTML = innerRing;
 
  const degPerLetter = 360 / N;
  let shift = 0;
  let rotationDeg = 0;
 
  const shiftBadge = document.getElementById('shiftBadge');
  const innerDiscEl = document.getElementById('innerDisc');
 
  function applyRotation(deg, animate){
    innerDiscEl.style.transition = animate ? '' : 'none';
    innerDiscEl.style.transform = `rotate(${deg}deg)`;
  }
 
  function setShift(newShift, animate){
    shift = ((newShift % N) + N) % N;
    rotationDeg = shift * degPerLetter;
    applyRotation(rotationDeg, animate !== false);
    shiftBadge.textContent = `geser: ${shift}`;
    updateOutput();
  }
 
  let dragging = false;
  let dragStartAngle = 0;
  let rotationAtDragStart = 0;
  let lastBoundaryIndex = 0;
  let cachedCtmInverse = null;
 
  function getAngleFromEvent(evt, ctmInverse){
    const svg = innerDiscEl.ownerSVGElement;
    const pt = svg.createSVGPoint();
    const point = evt.touches ? evt.touches[0] : evt;
    pt.x = point.clientX;
    pt.y = point.clientY;
    const loc = pt.matrixTransform(ctmInverse || svg.getScreenCTM().inverse());
    const dx = loc.x - CX;
    const dy = loc.y - CY;
    return Math.atan2(dy, dx) * 180 / Math.PI;
  }
 
  function startDrag(evt){
    dragging = true;
    getAudioCtx();
    innerDiscEl.classList.add('dragging');
    cachedCtmInverse = innerDiscEl.ownerSVGElement.getScreenCTM().inverse();
    dragStartAngle = getAngleFromEvent(evt, cachedCtmInverse);
    rotationAtDragStart = rotationDeg;
    lastBoundaryIndex = Math.round(rotationDeg / degPerLetter);
    evt.preventDefault();
  }
 
  function moveDrag(evt){
    if(!dragging) return;
    const currentAngle = getAngleFromEvent(evt, cachedCtmInverse);
    let delta = currentAngle - dragStartAngle;
    rotationDeg = rotationAtDragStart + delta;
    applyRotation(rotationDeg, false);
 
    const currentBoundaryIndex = Math.round(rotationDeg / degPerLetter);
    if(currentBoundaryIndex !== lastBoundaryIndex){
      playTick();
      lastBoundaryIndex = currentBoundaryIndex;
 
      // update angka & hasil secara realtime, tanpa animasi/snap
      shift = ((currentBoundaryIndex % N) + N) % N;
      shiftBadge.textContent = `geser: ${shift}`;
      updateOutput();
    }
    evt.preventDefault();
  }
 
  function endDrag(){
    if(!dragging) return;
    dragging = false;
    innerDiscEl.classList.remove('dragging');
    const snappedShift = Math.round(rotationDeg / degPerLetter);
    setShift(snappedShift, true);
  }
 
  innerDiscEl.addEventListener('mousedown', startDrag);
  window.addEventListener('mousemove', moveDrag);
  window.addEventListener('mouseup', endDrag);
  innerDiscEl.addEventListener('touchstart', startDrag, {passive:false});
  window.addEventListener('touchmove', moveDrag, {passive:false});
  window.addEventListener('touchend', endDrag);
 
  document.getElementById('nudgeLeft').addEventListener('click', ()=> { playTick(1.3); setShift(shift - 1, true); });
  document.getElementById('nudgeRight').addEventListener('click', ()=> { playTick(1.3); setShift(shift + 1, true); });
 
  let mode = 'encode';
  const modeButtons = document.querySelectorAll('.mode-btn');
  const outputLabel = document.getElementById('outputLabel');
  const footnote = document.getElementById('footnote');
  const inputText = document.getElementById('inputText');
  const outputText = document.getElementById('outputText');
 
  modeButtons.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      modeButtons.forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      mode = btn.dataset.mode;
      outputLabel.textContent = mode === 'encode' ? 'hasil sandi' : 'hasil terpecahkan';
      updateOutput();
    });
  });
 
  function caesarShift(text, s){
    return text.replace(/[a-zA-Z]/g, ch => {
      const isUpper = ch === ch.toUpperCase();
      const base = isUpper ? 65 : 97;
      const code = ch.charCodeAt(0) - base;
      const shifted = ((code + s) % 26 + 26) % 26;
      return String.fromCharCode(shifted + base);
    });
  }
 
  function updateOutput(){
    const text = inputText.value;
    const s = mode === 'encode' ? shift : -shift;
    const result = caesarShift(text, s);
    outputText.textContent = result || ' ';
    footnote.textContent = mode === 'encode'
      ? `setiap huruf digeser maju ${shift} posisi.`
      : `setiap huruf digeser mundur ${shift} posisi untuk mengembalikan pesan.`;
  }
 
  inputText.addEventListener('input', updateOutput);
 
  setShift(0, false);
})();
</script>
</body>
</html>
