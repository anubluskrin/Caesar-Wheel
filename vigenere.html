<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vigenère Cipher</title>
<link rel="stylesheet" href="/shared/theme.css">
</head>
<body>
<body>
  <div class="sheet">
  <div id="nav-slot"></div>

  <div class="letterhead">
    <h1>Vigenère Cipher</h1>
    <div class="ref">No. seri: V-26<br>Sandi kunci-berulang</div>
  </div>

  <p class="footnote" style="margin-bottom:24px;">
    Setiap huruf pesan digeser sebesar posisi huruf kunci yang bersesuaian —
    kunci diulang sepanjang pesan.
  </p>

  <div class="bento-grid">

    <!-- PANEL KIRI: input & kontrol -->
    <div class="bento-panel">
      <div class="mode-row" style="margin-bottom:0;">
        <button class="mode-btn active" data-mode="encrypt">Sandikan</button>
        <button class="mode-btn" data-mode="decrypt">Pecahkan</button>
      </div>

      <div class="field">
        <label for="keyInput">kata kunci</label>
        <input type="text" id="keyInput" value="RAHASIA">
      </div>

      <div class="field">
        <label for="inputText">teks asli</label>
        <textarea id="inputText" style="min-height:160px;">SELAMAT DATANG DI YOGYAKARTA</textarea>
      </div>

      <button class="run-btn" id="runBtn">Jalankan Proses ▶</button>
    </div>

    <!-- PANEL KANAN: log proses & hasil -->
    <div class="bento-panel">
      <div class="field">
        <label>proses tiap huruf</label>
        <div id="processLogContainer" class="terminal-log" style="min-height:220px;"></div>
      </div>

      <div class="field">
        <label id="outputLabel">hasil sandi</label>
        <div class="output-box" id="outputText"></div>
      </div>
    </div>

  </div>
</div>

<script src="/shared/nav.js"></script>
<script src="/shared/process-log.js"></script>
<script src="/ciphers/vigenere.js"></script>
<script>
  let mode = 'encrypt';
  const modeButtons = document.querySelectorAll('.mode-btn');
  const keyInput = document.getElementById('keyInput');
  const inputText = document.getElementById('inputText');
  const outputText = document.getElementById('outputText');
  const outputLabel = document.getElementById('outputLabel');
  const runBtn = document.getElementById('runBtn');

  modeButtons.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      modeButtons.forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      mode = btn.dataset.mode;
      outputLabel.textContent = mode === 'encrypt' ? 'hasil sandi' : 'hasil terpecahkan';
    });
  });

  wireCipherRunner({
    runBtn, outputText,
    containerId: 'processLogContainer',
    computeFn: () => vigenereProcess(inputText.value, keyInput.value, mode),
    formatLine: s => `${s.char} (kunci=${s.keyChar})  P=${s.charCode} ${s.shift} → ${s.resultChar}`
  });
</script>
</body>
</html>
