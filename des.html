<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DES</title>
<link rel="stylesheet" href="/shared/theme.css">
</head>
<body>

<div class="sheet">
  <div id="nav-slot"></div>

  <div class="letterhead">
    <h1>DES</h1>
    <div class="ref">No. seri: DES-56<br>Block cipher, 16 ronde Feistel</div>
  </div>

  <p class="footnote" style="margin-bottom:20px; font-size:16px;">
    Data Encryption Standard — memproses pesan per blok 64-bit (8 karakter), kunci
    efektif 56-bit, 16 ronde jaringan Feistel. Kunci dipakai apa adanya (8 karakter
    pertama; kurang dari itu di-pad nol). Mode ECB dengan padding PKCS5.
  </p>

  <div class="field">
    <label for="keyInput">kunci (8 karakter)</label>
    <input type="text" id="keyInput" value="RAHASIA1" maxlength="8">
  </div>

  <div class="bento-grid">

    <div class="bento-panel">
      <div class="mode-row" style="margin-bottom:0;">
        <button class="mode-btn active" data-mode="encrypt">Sandikan</button>
        <button class="mode-btn" data-mode="decrypt">Pecahkan</button>
      </div>

      <div class="field">
        <label id="inputLabel" for="inputText">teks asli</label>
        <textarea id="inputText" style="min-height:140px; font-size:17px;">HI DES CIPHER</textarea>
      </div>

      <button class="run-btn" id="runBtn">Jalankan Proses ▶</button>
      <p class="footnote" id="warnBox" style="margin-top:8px; font-size:15px;"></p>
    </div>

    <div class="bento-panel">
      <div class="field">
        <label>log tiap ronde (per blok)</label>
        <div id="processLogContainer" class="terminal-log" style="min-height:300px; font-size:15px;"></div>
      </div>

      <div class="field">
        <label id="outputLabel">hasil (hex)</label>
        <div class="output-box" id="outputText" style="font-size:17px;"></div>
      </div>
    </div>

  </div>
</div>

<script src="/shared/nav.js"></script>
<script src="/shared/process-log.js"></script>
<script src="/shared/byte-utils.js"></script>
<script src="/ciphers/des.js"></script>
<script>
  let mode = 'encrypt';
  const modeButtons = document.querySelectorAll('.mode-btn');
  const keyInput = document.getElementById('keyInput');
  const inputText = document.getElementById('inputText');
  const inputLabel = document.getElementById('inputLabel');
  const outputText = document.getElementById('outputText');
  const outputLabel = document.getElementById('outputLabel');
  const warnBox = document.getElementById('warnBox');
  const runBtn = document.getElementById('runBtn');

  modeButtons.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      modeButtons.forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      mode = btn.dataset.mode;
      inputLabel.textContent = mode === 'encrypt' ? 'teks asli' : 'teks tersandi (hex)';
      outputLabel.textContent = mode === 'encrypt' ? 'hasil (hex)' : 'hasil (teks asli)';
      warnBox.textContent = '';
      if(mode === 'encrypt'){
        inputText.value = 'HI DES CIPHER';
      } else {
        inputText.value = desProcess('HI DES CIPHER', keyInput.value, 'encrypt').result;
      }
    });
  });

  runBtn.addEventListener('click', ()=>{
    warnBox.textContent = '';
    outputText.textContent = ' ';
    try{
      const { result, steps } = desProcess(inputText.value, keyInput.value, mode);
      runBtn.disabled = true;
      runTerminalLog('processLogContainer', steps, ()=>{
        outputText.textContent = result || ' ';
        runBtn.disabled = false;
      }, 15);
    }catch(err){
      warnBox.textContent = err.message;
    }
  });
</script>
</body>
</html>
